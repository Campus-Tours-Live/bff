name: PR template

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Required, blocking gate — structure + deterministic quality. Frontend UI changes also need
  # before/after screenshots (bff/backend are exempt).
  pr-template:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const repo = context.repo.repo;
            const clean = body.replace(/<!--[\s\S]*?-->/g, '');
            const problems = [];
            const section = (name) => {
              const re = new RegExp('##\\s*' + name + '\\b([\\s\\S]*?)(?=\\n##\\s|$)', 'i');
              const m = clean.match(re);
              return m ? m[1].trim() : null;
            };
            const JUNK = new Set(['n/a','na','none','nil','no','yes','tbd','todo','to do','test','testing','asdf','asdfasdf','xxx','x','.','-','--','...','ok','okay','done','wip','update','fix','fixes','change','changes','stuff','things','misc']);
            const words = (s) => (s.match(/[A-Za-z0-9]+/g) || []);
            const isGibberish = (s) => {
              const t = (s || '').trim();
              if (/^(.)\1{5,}$/.test(t.replace(/\s/g, ''))) return true;
              if (words(t).length <= 1 && t.replace(/\s/g, '').length >= 20) return true;
              return false;
            };
            const check = (name, minChars, minWords) => {
              const s = section(name);
              if (s === null) { problems.push(`Missing the "## ${name}" section`); return null; }
              if (!s) { problems.push(`The "## ${name}" section is empty`); return null; }
              const norm = s.toLowerCase().replace(/[.!\s]+$/, '').trim();
              if (JUNK.has(norm)) { problems.push(`The "## ${name}" section looks like a placeholder ("${s.slice(0, 25)}") — write a real description`); return s; }
              if (isGibberish(s)) { problems.push(`The "## ${name}" section looks like gibberish — write a real description`); return s; }
              if (s.length < minChars) { problems.push(`The "## ${name}" section is too short (needs at least ${minChars} characters)`); return s; }
              if (words(s).length < minWords) { problems.push(`The "## ${name}" section needs at least ${minWords} words`); return s; }
              return s;
            };
            const summary = check('Summary', 30, 6);
            const testing = check('Testing', 15, 3);
            if (summary && testing && summary.trim().toLowerCase() === testing.trim().toLowerCase())
              problems.push('The "## Summary" and "## Testing" sections are identical — describe testing separately');
            const typeBlock = (body.match(/##\s*Type of change\b([\s\S]*?)(?=\n##\s|$)/i) || [, ''])[1];
            const checkedLines = typeBlock.split('\n').filter((l) => /-\s*\[x\]/i.test(l));
            if (!checkedLines.length) problems.push('Check at least one box under "## Type of change"');
            // Frontend UI changes must include before/after screenshots (bff/backend are exempt).
            if (repo === 'frontend') {
              const onlyDocs = checkedLines.length > 0 && checkedLines.every((l) => /docs|chore|config/i.test(l));
              if (!onlyDocs) {
                const shots = section('Screenshots') || '';
                const imgs = (shots.match(/!\[[^\]]*\]\([^)]+\)|<img\b|https?:\/\/(?:github\.com\/user-attachments|[^\s)]*githubusercontent\.com)[^\s)]*/gi) || []).length;
                if (imgs < 2) problems.push('Frontend UI change needs before/after screenshots — attach at least 2 images under "## Screenshots" (or check only "Docs / chore / config" if there is no visual change)');
              }
            }
            if (problems.length) {
              core.setFailed('PR description does not follow .github/pull_request_template.md:\n- ' + problems.join('\n- ') + '\n\nEdit the PR description and the check will re-run.');
            } else {
              core.info('PR description structure + quality OK.');
            }

  # Advisory, best-effort AI check — is the description on-topic vs the diff? Skips cleanly if
  # ANTHROPIC_API_KEY is unset or the API errors (never blocks on infra).
  pr-description-ai:
    runs-on: ubuntu-latest
    steps:
      - name: AI sanity-check the description against the diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY — skipping AI description check (advisory)."; exit 0; fi
          gh pr diff "$PR_NUMBER" --repo "$REPO" 2>/dev/null | head -c 12000 > /tmp/diff.txt || true
          node - <<'NODE'
          const fs = require('fs');
          const body = process.env.PR_BODY || '';
          const diff = fs.existsSync('/tmp/diff.txt') ? fs.readFileSync('/tmp/diff.txt', 'utf8') : '';
          const base = (process.env.ANTHROPIC_BASE_URL || 'https://api.anthropic.com').replace(/\/$/, '');
          const prompt = [
            'You are a LENIENT PR-description gate. Decide whether the PR description genuinely and on-topically describes the change shown in the diff.',
            'Be lenient: short but real descriptions PASS. Only FAIL when the description is clearly meaningless, generic filler ("some changes", "update stuff", "improve things"), copy-paste noise, or plainly contradicts/ignores the diff. When in doubt, PASS.',
            'Reply with exactly one line: "VERDICT: PASS" or "VERDICT: FAIL - <short reason>".',
            '', '=== PR DESCRIPTION ===', body, '', '=== DIFF (truncated) ===', diff,
          ].join('\n');
          (async () => {
            try {
              const r = await fetch(base + '/v1/messages', {
                method: 'POST',
                headers: { 'x-api-key': process.env.ANTHROPIC_API_KEY, 'anthropic-version': '2023-06-01', 'content-type': 'application/json' },
                body: JSON.stringify({ model: 'claude-opus-4-8', max_tokens: 150, messages: [{ role: 'user', content: prompt }] }),
              });
              if (!r.ok) { console.log('AI check HTTP ' + r.status + ' — skipping (advisory).'); process.exit(0); }
              const j = await r.json();
              const text = (j.content || []).map((c) => c.text || '').join('').trim();
              console.log('AI verdict: ' + text);
              if (/VERDICT:\s*FAIL/i.test(text)) {
                const reason = (text.split(/FAIL\s*[-–—:]*\s*/i)[1] || 'description not meaningful').trim();
                console.log('::error::AI description check: ' + reason);
                process.exit(1);
              }
            } catch (e) {
              console.log('AI check error (' + e.message + ') — skipping (advisory).');
            }
            process.exit(0);
          })();
          NODE
